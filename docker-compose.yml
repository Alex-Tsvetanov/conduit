# Servers for the integration tests and the demonstration.
#
# The versions are pinned so a measurement can be repeated later against the
# same server. The ports are shifted away from the defaults so the containers
# do not collide with a PostgreSQL or MySQL already installed on the machine.
#
# PostgreSQL is started with ssl=on and a self-signed test certificate in
# docker/certs/. The same port still accepts plaintext, so the original
# integration cases do not have to change. MySQL 8.0 already generates
# certificates on first start and advertises CLIENT_SSL.
#
#   docker compose up -d
#   ctest --test-dir build -L integration
#   docker compose down -v

services:
  postgres:
    image: postgres:16.4
    container_name: conduit_postgres
    entrypoint: ["/bin/bash", "/usr/local/bin/conduit-postgres-ssl.sh"]
    volumes:
      - ./docker/postgres-ssl.sh:/usr/local/bin/conduit-postgres-ssl.sh:ro
      - ./docker/certs:/certs:ro
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
      # Left at the image default, which is scram-sha-256 on this version. The
      # client implements SCRAM, so weakening the server would hide the code
      # that actually runs against a modern PostgreSQL.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.0.39
    container_name: conduit_mysql
    # mysql_native_password is the plugin this client implements. MySQL 8.0
    # still ships it; on 8.4 and later it has to be enabled explicitly.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: conduit_root
      MYSQL_USER: conduit
      MYSQL_PASSWORD: conduit
      MYSQL_DATABASE: conduit
    ports:
      - "33306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uconduit -pconduit --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  # The vendor library comparison. Built and run here because neither libpq nor
  # libmysqlclient is installed on the Windows machine the rest of the report was
  # measured on. Run it with:
  #
  #   docker compose run --rm --build bench
  #
  # Its numbers stand on their own and are not mixed with the host measurements.
  bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    container_name: conduit_bench
    profiles: ["bench"]
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      CONDUIT_PG_HOST: postgres
      CONDUIT_PG_PORT: "5432"
      CONDUIT_PG_USER: conduit
      CONDUIT_PG_PASSWORD: conduit
      CONDUIT_PG_DATABASE: conduit
      CONDUIT_MYSQL_HOST: mysql
      CONDUIT_MYSQL_PORT: "3306"
      CONDUIT_MYSQL_USER: conduit
      CONDUIT_MYSQL_PASSWORD: conduit
      CONDUIT_MYSQL_DATABASE: conduit
